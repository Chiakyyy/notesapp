apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  namespace: notesapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-api
  template:
    metadata:
      labels:
        app: notes-api
    spec:
      containers:
        - name: notes-api
          image: registry.gitlab.com/chiakyyy/notesapp/notesapp-notes-api:latest
          env:
            - name: DB_HOST
              value: "notes-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "notesdb"
            - name: DB_USER
              value: "notesuser"
            - name: DB_PASSWORD
              value: "notessecret"
          ports:
            - containerPort: 5000
