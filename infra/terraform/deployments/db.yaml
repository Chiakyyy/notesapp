apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-db
  namespace: notesapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-db
  template:
    metadata:
      labels:
        app: notes-db
    spec:
      containers:
        - name: notes-db
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: notesdb
            - name: POSTGRES_USER
              value: notesuser
            - name: POSTGRES_PASSWORD
              value: notessecret
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: notes-db-volume
      volumes:
        - name: notes-db-volume
          emptyDir: {}    # simple persistence for minikube
