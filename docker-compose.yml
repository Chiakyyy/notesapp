version: "3.9"

services:
  notes-db:
    image: postgres:16-alpine
    container_name: notes-db
    environment:
      POSTGRES_DB: notesdb
      POSTGRES_USER: notesuser
      POSTGRES_PASSWORD: notessecret
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - notes-net

  notes-api:
    build: ./api
    container_name: notes-api
    environment:
      DB_HOST: notes-db
      DB_PORT: 5432
      DB_NAME: notesdb
      DB_USER: notesuser
      DB_PASSWORD: notessecret
    depends_on:
      - notes-db
    ports:
      - "5000:5000"
    networks:
      - notes-net

  notes-frontend:
    build: ./frontend
    container_name: notes-frontend
    depends_on:
      - notes-api
    ports:
      - "8080:80"
    networks:
      - notes-net

networks:
  notes-net:
    driver: bridge