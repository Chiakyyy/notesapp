---
- name: Full Kubernetes NotesApp Setup
  hosts: localhost
  connection: local
  become: true

  vars:
    kubectl_version: "v1.30.0"
    minikube_version: "v1.34.0"
    terraform_version: "1.9.8"
    helm_version: "v3.15.4"

    minikube_driver: "docker"

    metallb_ip_range_start: "192.168.49.240"
    metallb_ip_range_end: "192.168.49.250"

    terraform_dir: "{{ playbook_dir }}/../infra/terraform"

    kubeconfig_path: "{{ lookup('env','HOME') }}/.kube/config"

  tasks:

    ########################################################################
    # 1. Base tools
    ########################################################################
    - name: Install base packages
      apt:
        name:
          - curl
          - wget
          - git
          - jq
          - unzip
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
          - socat
          - conntrack
        state: present
        update_cache: yes

    ########################################################################
    # 2. Install Docker
    ########################################################################
    - name: Install Docker engine
      apt:
        name: docker.io
        state: present

    - name: Ensure Docker is running
      systemd:
        name: docker
        state: started
        enabled: yes

    ########################################################################
    # 3. Install kubectl
    ########################################################################
    - name: Download kubectl
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"

    ########################################################################
    # 4. Install Minikube
    ########################################################################
    - name: Download Minikube
      get_url:
        url: "https://storage.googleapis.com/minikube/releases/{{ minikube_version }}/minikube-linux-amd64"
        dest: /usr/local/bin/minikube
        mode: "0755"

    ########################################################################
    # 5. Install Terraform
    ########################################################################
    - name: Download Terraform zip
      get_url:
        url: "https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_amd64.zip"
        dest: /tmp/terraform.zip

    - name: Unzip Terraform
      unarchive:
        src: /tmp/terraform.zip
        dest: /usr/local/bin
        remote_src: yes
      args:
        creates: /usr/local/bin/terraform

    - name: Ensure terraform is executable
      file:
        path: /usr/local/bin/terraform
        mode: "0755"
        state: file

    ####################################################################
    # 6. Install Helm
    ####################################################################
    - name: Download Helm
      get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: /tmp/helm.tar.gz

    - name: Extract Helm
      unarchive:
        src: /tmp/helm.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Move Helm binary
      command: cp /tmp/linux-amd64/helm /usr/local/bin/helm
      args:
        creates: /usr/local/bin/helm

    - name: Ensure helm is executable
      file:
        path: /usr/local/bin/helm
        mode: "0755"

    ########################################################################
    # 7. Start Minikube
    ########################################################################
    - name: Add current user to docker group
      user:
        name: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
        groups: docker
        append: yes
    
    - name: Start Minikube cluster
      become: false
      command: >
        minikube start
        --driver={{ minikube_driver }}
        --force
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    ########################################################################
    # 8. Enable Ingress
    ########################################################################
    - name: Enable Minikube ingress addon
      command: minikube addons enable ingress
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    ########################################################################
    # 9. Install MetalLB via Helm (CRDs included)
    ########################################################################
    - name: Add MetalLB Helm repo
      command: >
        helm repo add metallb https://metallb.github.io/metallb
        --force-update

    - name: Update Helm repos
      command: helm repo update

    - name: Install MetalLB via Helm (with CRDs)
      command: >
        helm install metallb metallb/metallb
        --namespace metallb-system
        --create-namespace
        --set installCRDs=true
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    ########################################################################
    # 10. Create MetalLB address pool + L2Advertisement
    ########################################################################
    - name: Create MetalLB config
      copy:
        dest: /tmp/metallb-config.yaml
        content: |
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: first-pool
            namespace: metallb-system
          spec:
            addresses:
              - "{{ metallb_ip_range_start }}-{{ metallb_ip_range_end }}"
          ---
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: l2adv
            namespace: metallb-system
          spec:
            ipAddressPools:
              - first-pool

    ########################################################################
    # WAIT FOR METALLB TO BE READY
    ########################################################################
    - name: Wait for MetalLB controller to be ready
      command: >
        kubectl wait --for=condition=Available
        deployment/metallb-controller
        -n metallb-system
        --timeout=120s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Wait for MetalLB speaker DaemonSet rollout
      command: >
        kubectl rollout status
        daemonset/metallb-speaker
        -n metallb-system
        --timeout=120s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Wait for MetalLB webhook endpoints
      shell: |
        kubectl get endpoints metallb-webhook-service -n metallb-system --no-headers | grep -v "<none>"
      retries: 20
      delay: 3
      register: webhook_ready
      until: webhook_ready.rc == 0
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Apply MetalLB config
      command: kubectl apply -f /tmp/metallb-config.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    ########################################################################
    # 11. Get Minikube IP
    ########################################################################
    - name: Get Minikube IP
      command: minikube ip
      register: minikube_ip_cmd
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Set Minikube IP fact
      set_fact:
        minikube_ip: "{{ minikube_ip_cmd.stdout }}"

    ########################################################################
    # 12. Apply Ingress template into Terraform folder
    ########################################################################
    - name: Inject Ingress.yaml
      template:
        src: ingress.yaml.j2
        dest: "{{ terraform_dir }}/ingress/ingress.yaml"

    ########################################################################
    # 13. Terraform Deploy
    ########################################################################
    - name: Terraform init
      command: terraform init
      args:
        chdir: "{{ terraform_dir }}"

    - name: Terraform apply
      command: terraform apply -auto-approve
      args:
        chdir: "{{ terraform_dir }}"

    ########################################################################
    # 14. Output cluster info
    ########################################################################
    - name: Show Pods
      command: kubectl get pods -n notesapp
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Show Services
      command: kubectl get svc -n notesapp
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Show Ingress
      command: kubectl get ingress -n notesapp
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    ########################################################################
    # 15. Final URL
    ########################################################################
    - name: Display public URL
      debug:
        msg: "Application accessible at: http://notes.{{ minikube_ip }}.nip.io"