---
- name: Full Kubernetes NotesApp platform setup
  hosts: localhost
  connection: local
  become: true

  vars:
    # Versions (you can adjust if needed)
    kubectl_version: "v1.30.0"
    minikube_version: "v1.34.0"
    terraform_version: "1.9.8"
    helm_version: "v3.15.4"

    minikube_driver: "docker"

    # MetalLB IP range (inside Minikube’s network)
    metallb_ip_range_start: "192.168.49.240"
    metallb_ip_range_end: "192.168.49.250"

    # Path to your terraform directory (relative to this playbook)
    terraform_dir: "{{ playbook_dir }}/../infra/terraform"

  tasks:

    # 1) Base tools
    - name: Install base packages
    apt:
      name:
        - curl
        - wget
        - git
        - jq
        - unzip
        - apt-transport-https
        - ca-certificates
        - gnupg
        - lsb-release
        - socat
        - conntrack
      state: present
      update_cache: yes

    # 2) Docker
    - name: Install Docker engine
      apt:
        name: docker.io
        state: present

    - name: Ensure Docker service is enabled and running
      systemd:
        name: docker
        state: started
        enabled: yes

    # 3) kubectl
    - name: Download kubectl
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"

    # 4) Minikube
    - name: Download Minikube
      get_url:
        url: "https://storage.googleapis.com/minikube/releases/{{ minikube_version }}/minikube-linux-amd64"
        dest: /usr/local/bin/minikube
        mode: "0755"

    # 5) Terraform
    - name: Download Terraform archive
      get_url:
        url: "https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_amd64.zip"
        dest: /tmp/terraform.zip
        mode: "0644"

    - name: Unzip Terraform
      unarchive:
        src: /tmp/terraform.zip
        dest: /usr/local/bin/
        remote_src: yes
      args:
        creates: /usr/local/bin/terraform

    # 6) Helm
    - name: Download Helm archive
      get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: /tmp/helm.tar.gz
        mode: "0644"

    - name: Extract Helm binary
      unarchive:
        src: /tmp/helm.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Move Helm binary to /usr/local/bin
      copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/local/bin/helm
        mode: "0755"
      # don't fail if already exists
      ignore_errors: yes

    # 7) Start Minikube
    - name: Start Minikube cluster
      command: >
        minikube start
        --driver={{ minikube_driver }}
      args:
        creates: /root/.minikube/machines/minikube

    # 8) Enable Ingress addon
    - name: Enable Minikube ingress addon
      command: minikube addons enable ingress
      register: ingress_addon
      changed_when: "'enabled' in ingress_addon.stdout or 'already enabled' in ingress_addon.stdout"

    # 9) Enable MetalLB addon
    - name: Enable Minikube MetalLB addon
      command: minikube addons enable metallb
      register: metallb_addon
      changed_when: "'enabled' in metallb_addon.stdout or 'already enabled' in metallb_addon.stdout"

    # 10) Configure MetalLB with an IP range
    - name: Create MetalLB config manifest
      copy:
        dest: /tmp/metallb-config.yaml
        content: |
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: first-pool
            namespace: metallb-system
          spec:
            addresses:
              - "{{ metallb_ip_range_start }}-{{ metallb_ip_range_end }}"
          ---
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: l2adv
            namespace: metallb-system

    - name: Apply MetalLB config
      command: kubectl apply -f /tmp/metallb-config.yaml
      environment:
        KUBECONFIG: /root/.kube/config

    # 11) Get Minikube IP
    - name: Get Minikube IP
      command: minikube ip
      register: minikube_ip_cmd

    - name: Set Minikube IP fact
      set_fact:
        minikube_ip: "{{ minikube_ip_cmd.stdout }}"

    # 12) Template the Ingress with dynamic host (notes.<IP>.nip.io)
    - name: Generate Ingress manifest with Minikube IP
      template:
        src: ingress.yaml.j2
        dest: "{{ terraform_dir }}/ingress/ingress.yaml"

    # 13) Initialize Terraform
    - name: Terraform init
      command: terraform init
      args:
        chdir: "{{ terraform_dir }}"

    # 14) Apply Terraform (namespace + deployments + services + ingress)
    - name: Terraform apply
      command: terraform apply -auto-approve
      args:
        chdir: "{{ terraform_dir }}"

    # 15) Show pods/services/ingress
    - name: Get pods in notesapp namespace
      command: kubectl get pods -n notesapp
      register: pods_output
      environment:
        KUBECONFIG: /root/.kube/config
      changed_when: false

    - name: Display pods
      debug:
        msg: "{{ pods_output.stdout_lines }}"

    - name: Get services in notesapp namespace
      command: kubectl get svc -n notesapp
      register: svc_output
      environment:
        KUBECONFIG: /root/.kube/config
      changed_when: false

    - name: Display services
      debug:
        msg: "{{ svc_output.stdout_lines }}"

    - name: Get ingress in notesapp namespace
      command: kubectl get ingress -n notesapp
      register: ingress_output
      environment:
        KUBECONFIG: /root/.kube/config
      changed_when: false

    - name: Display ingress
      debug:
        msg: "{{ ingress_output.stdout_lines }}"

    # 16) Print final URL
    - name: Show public URL
      debug:
        msg: "Application accessible (from the VM / correct network) at: http://notes.{{ minikube_ip }}.nip.io"
